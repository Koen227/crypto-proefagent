name: Crypto Proefagent

on:
  schedule:
    - cron: "*/15 * * * *"   # elke 15 minuten bewaken; elke 4 uur scant de agent ook
  workflow_dispatch: {}       # met de hand starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: proefagent
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check uitvoeren
        run: python run.py

      - name: Nieuwe stand opslaan
        run: |
          git config user.name "proefagent"
          git config user.email "proefagent@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Check $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
